name: Build Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3

      - name: Build
        run: gradle build
        working-directory: fps-overlay

      - uses: actions/upload-artifact@v4
        with:
          name: mod
          path: fps-overlay/build/libs/*.jar
